[tool.pytest.ini_options]
# Run from: backend/
# Command: pytest
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
pythonpath = ["src"]
# camelCase test file collection (e.g. testConfig.py, testCvParser.py)
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
